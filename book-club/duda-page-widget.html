<!--
  AXITOS BOOK CLUB — Duda Page Widget
  ─────────────────────────────────────
  Paste this entire file into a Duda HTML widget on your Book Club page.
-->

<div id="axbc-root" style="max-width:1100px;margin:0 auto;padding:0 16px 48px">

  <!-- Personalized welcome (Firebase logged-in users only) -->
  <div id="axbc-welcome" style="display:none;background:linear-gradient(135deg,#5c3d99 0%,#7b5bb6 100%);color:#fff;border-radius:14px;padding:22px 28px;margin-bottom:36px;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(92,61,153,0.25)">
    <span style="font-size:38px;flex-shrink:0">👋</span>
    <div>
      <div id="axbc-welcome-msg" style="font-size:19px;font-weight:700"></div>
      <div style="font-size:14px;opacity:0.82;margin-top:3px">Your curated eBooks are ready — enjoy every page!</div>
    </div>
  </div>

  <!-- Page header -->
  <div style="text-align:center;margin-bottom:40px">
    <div style="font-size:44px;margin-bottom:10px">📚</div>
    <h2 style="font-size:28px;font-weight:800;color:#1a1a1a;margin:0 0 8px">Book Club eBooks</h2>
    <p style="color:#777;font-size:15px;margin:0;max-width:480px;margin-left:auto;margin-right:auto">
      Hand-picked Kindle eBooks — free &amp; under <strong style="color:#5c3d99">$1</strong>. Click any book to get it on Amazon.
    </p>
  </div>

  <!-- Skeleton loading placeholders -->
  <div id="axbc-loading">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:24px">
      <div class="axbc-skeleton"></div>
      <div class="axbc-skeleton"></div>
      <div class="axbc-skeleton"></div>
      <div class="axbc-skeleton"></div>
      <div class="axbc-skeleton"></div>
      <div class="axbc-skeleton"></div>
    </div>
  </div>

  <!-- Book grid -->
  <div id="axbc-grid" style="display:none"></div>

  <!-- Empty state -->
  <div id="axbc-empty" style="display:none;text-align:center;padding:56px 24px;color:#aaa">
    <div style="font-size:40px;margin-bottom:14px">📖</div>
    <div style="font-size:16px;font-weight:600;color:#666;margin-bottom:8px">New picks coming soon</div>
    <div style="font-size:14px">Check back shortly — our editors are selecting the next batch.</div>
  </div>

</div>

<style>
  #axbc-root * { box-sizing: border-box; }

  .axbc-skeleton {
    border-radius: 10px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: axbc-shimmer 1.4s infinite;
    aspect-ratio: 2/3;
    min-height: 220px;
  }
  @keyframes axbc-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .axbc-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.07);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .axbc-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 28px rgba(92,61,153,0.18);
  }
  .axbc-cover-wrap {
    position: relative;
    overflow: hidden;
    aspect-ratio: 2/3;
    background: #f0edf7;
  }
  .axbc-cover {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 0.3s ease;
  }
  .axbc-card:hover .axbc-cover { transform: scale(1.04); }

  .axbc-price-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 7px;
    border-radius: 20px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .axbc-price-badge.free  { background: #22c55e; color: #fff; }
  .axbc-price-badge.paid  { background: #5c3d99; color: #fff; }

  .axbc-info {
    padding: 13px 14px 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .axbc-title {
    font-size: 13px;
    font-weight: 700;
    color: #1a1a1a;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .axbc-author {
    font-size: 12px;
    color: #999;
    margin-bottom: 10px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .axbc-btn {
    display: block;
    background: #5c3d99;
    color: #fff;
    text-align: center;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.2s;
  }
  .axbc-btn:hover { background: #4a2f80; color: #fff; }

  #axbc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 24px;
  }

  @media (max-width: 500px) {
    #axbc-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .axbc-info  { padding: 10px 10px 12px; }
    .axbc-title { font-size: 12px; }
  }
</style>

<script>
(function () {
  var ENDPOINT  = 'https://script.google.com/macros/s/AKfycbyXpLkm5YWduvctKzsGDGX_BXZWUj4RFuq6TJ50vPIf2gPKq5GdHGIb8EwKRQfTZMck/exec';
  var CACHE_KEY = 'axbc_books_v1';
  var CACHE_TTL = 6 * 60 * 60 * 1000; // 6 hours

  // ── Firebase welcome ─────────────────────────────────────────────────────
  function initWelcome() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (!key || key.indexOf('firebase:authUser') !== 0) continue;
        var user  = JSON.parse(localStorage.getItem(key));
        var first = (user.displayName || user.email || '').split(/[\s@]/)[0];
        if (!first) break;
        var banner = document.getElementById('axbc-welcome');
        var msg    = document.getElementById('axbc-welcome-msg');
        if (banner && msg) {
          msg.textContent = 'Welcome back, ' + first + '!';
          banner.style.display = 'flex';
        }
        break;
      }
    } catch (e) {}
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Render books ─────────────────────────────────────────────────────────
  function renderBooks(books) {
    document.getElementById('axbc-loading').style.display = 'none';

    if (!books || books.length === 0) {
      document.getElementById('axbc-empty').style.display = 'block';
      return;
    }

    var grid = document.getElementById('axbc-grid');
    // Clear any previous cards (in case of background refresh)
    grid.innerHTML = '';

    books.forEach(function (book) {
      var isFree     = book.price_num === 0 || book.price === 'Free';
      var badgeClass = isFree ? 'free' : 'paid';
      var badgeLabel = isFree ? 'Free' : esc(book.price);
      var btnLabel   = isFree ? 'Get Free eBook →' : 'View on Amazon →';

      var a = document.createElement('a');
      a.href      = esc(book.download_link);
      a.target    = '_blank';
      a.rel       = 'noopener noreferrer';
      a.className = 'axbc-card';
      a.setAttribute('aria-label', esc(book.title) + ' — ' + esc(book.price));
      a.innerHTML = (
        '<div class="axbc-cover-wrap">' +
          '<img class="axbc-cover" src="' + esc(book.cover_url) + '" ' +
               'alt="' + esc(book.title) + '" loading="lazy" ' +
               'onerror="this.closest(\'.axbc-card\').style.display=\'none\'">' +
          '<span class="axbc-price-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
        '</div>' +
        '<div class="axbc-info">' +
          '<div class="axbc-title">' + esc(book.title) + '</div>' +
          '<div class="axbc-author">' + esc(book.author) + '</div>' +
          '<span class="axbc-btn">' + btnLabel + '</span>' +
        '</div>'
      );
      grid.appendChild(a);
    });

    grid.style.display = 'grid';
  }

  // ── Load with localStorage cache ──────────────────────────────────────────
  function loadBooks() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved.books && saved.books.length > 0) {
          renderBooks(saved.books);
          // Cache still fresh — no network call needed
          if (Date.now() - saved.ts < CACHE_TTL) return;
          // Cache is stale — refresh silently in background
          fetchRemote(true);
          return;
        }
      }
    } catch (e) {}
    // Nothing cached — fetch and show
    fetchRemote(false);
  }

  function fetchRemote(silent) {
    fetch(ENDPOINT)
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (books) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), books: books }));
        } catch (e) {}
        if (!silent) renderBooks(books);
        else if (books && books.length > 0) renderBooks(books); // refresh visible grid
      })
      .catch(function () {
        if (!silent) {
          document.getElementById('axbc-loading').style.display = 'none';
          document.getElementById('axbc-empty').style.display   = 'block';
        }
      });
  }

  function init() {
    initWelcome();
    loadBooks();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
