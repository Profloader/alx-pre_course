/* ═══ Duda isolation reset ════════════════════════════════════════════════════
   These overrides beat Duda's theme cascade so the widget renders faithfully.
   ══════════════════════════════════════════════════════════════════════════ */
#kn-root {
  display: block;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  box-sizing: border-box;
  color: #1f1a14;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
#kn-root *, #kn-root *::before, #kn-root *::after {
  box-sizing: border-box;
}
#kn-root h1, #kn-root h2, #kn-root h3, #kn-root h4, #kn-root h5, #kn-root h6 {
  font-family: 'Fraunces', Georgia, serif !important;
  font-weight: inherit;
  font-size: inherit;
  line-height: inherit;
  margin: 0;
  padding: 0;
}
#kn-root a {
  color: inherit !important;
  text-decoration: none !important;
  cursor: pointer;
}
#kn-root button {
  font-family: 'Inter', sans-serif !important;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  margin: 0;
}
#kn-root p {
  margin: 0 !important;
  padding: 0;
}
#kn-root input, #kn-root textarea, #kn-root select {
  font-family: inherit !important;
  font-size: inherit;
}
#kn-root img {
  max-width: 100%;
  display: block;
}

/* ============ Koinita design tokens ============
   Concept: a members' reading room. Warm paper, deep ink, the Koinita amber
   carried over from Axitos, and a "spine" green that marks everything author-side
   so readers and authors are legible at a glance. Signature: the library card. */#kn-root {
  --paper:#FAF6EE;
  --paper-2:#F3EADB;
  --card:#FFFFFF;
  --ink:#241F19;
  --ink-soft:#6A6052;
  --ink-faint:#988C79;
  --amber:#D9541F;        /* Koinita / reader accent */
  --amber-deep:#A83B0F;
  --amber-wash:#FBEAE0;
  --spine:#2E5E4E;        /* author accent */
  --spine-deep:#1F4438;
  --spine-wash:#E4EEE9;
  --gold:#B5862F;         /* library-card foil */
  --line:#E6DBC8;
  --line-soft:#EFE7D8;
  --shadow:0 1px 2px rgba(36,31,25,.04), 0 12px 32px -16px rgba(36,31,25,.18);
  --shadow-lg:0 24px 60px -24px rgba(36,31,25,.40);
  --r:16px; --r-sm:10px;
  --display:"Fraunces", Georgia, serif;
  --body:"Inter", system-ui, sans-serif;
  --mono:"Spline Sans Mono", ui-monospace, monospace;
}#kn-root * {box-sizing:border-box}html {scroll-behavior:smooth}body {
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}#kn-root h1, #kn-root h2, #kn-root h3, #kn-root h4 {font-family:var(--display);font-weight:600;line-height:1.08;margin:0;letter-spacing:-.01em}#kn-root a {color:inherit}#kn-root button {font-family:inherit;cursor:pointer}#kn-root img {max-width:100%}#kn-root :focus-visible {outline:2.5px solid var(--amber);outline-offset:2px;border-radius:4px}#kn-root .hidden {display:none !important}#kn-root .mono {font-family:var(--mono)}#kn-root .wrap {max-width:1120px;margin:0 auto;padding:0 22px}/* ---------- buttons ---------- */#kn-root .btn {display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;
  padding:13px 22px;font-weight:600;font-size:15px;text-decoration:none;transition:.16s ease;white-space:nowrap}#kn-root .btn-amber {background:var(--amber);color:#fff;box-shadow:0 6px 18px -8px var(--amber)}#kn-root .btn-amber:hover {background:var(--amber-deep);transform:translateY(-1px)}#kn-root .btn-spine {background:var(--spine);color:#fff}#kn-root .btn-spine:hover {background:var(--spine-deep);transform:translateY(-1px)}#kn-root .btn-ink {background:var(--ink);color:var(--paper)}#kn-root .btn-ink:hover {transform:translateY(-1px)}#kn-root .btn-ghost {background:transparent;color:var(--ink);border:1.5px solid var(--line)}#kn-root .btn-ghost:hover {border-color:var(--ink);background:#fff}#kn-root .btn-sm {padding:9px 15px;font-size:13.5px}#kn-root .btn-block {width:100%;justify-content:center}#kn-root .btn[disabled] {opacity:.45;cursor:not-allowed;transform:none}/* ---------- chips / pills ---------- */#kn-root .chip {display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 11px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}#kn-root .chip.genre {background:#fff;border:1px solid var(--line)}#kn-root .chip.author {background:var(--spine-wash);color:var(--spine-deep);cursor:pointer;border:1px solid transparent}#kn-root .chip.author:hover {border-color:var(--spine)}#kn-root .chip.live {background:var(--amber-wash);color:var(--amber-deep)}#kn-root .chip.dot::before {content:"";width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}#kn-root .chip.verified {background:var(--spine);color:#fff}/* ============ top bar ============ */#kn-root .topbar {position:sticky;top:0;z-index:40;background:rgba(250,246,238,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft)}#kn-root .topbar .wrap {display:flex;align-items:center;gap:18px;height:66px}#kn-root .brand {display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:21px;
  letter-spacing:-.02em;text-decoration:none;cursor:pointer}#kn-root .brand .dot {width:9px;height:9px;border-radius:50%;background:var(--amber);margin-top:9px}#kn-root .nav-links {display:flex;gap:4px;margin-left:auto;align-items:center}#kn-root .nav-links a, #kn-root .nav-links button.linkbtn {padding:8px 14px;border-radius:999px;font-size:14.5px;font-weight:500;
  text-decoration:none;color:var(--ink-soft);background:none;border:none;transition:.15s}#kn-root .nav-links a:hover, #kn-root .nav-links button.linkbtn:hover {color:var(--ink);background:var(--paper-2)}#kn-root .nav-links a.active {color:var(--ink);background:#fff;box-shadow:var(--shadow)}#kn-root .avatar {width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:15px;border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer;flex:none}#kn-root .menu-toggle {display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:10px;
  width:42px;height:42px;font-size:20px}/* dropdown */#kn-root .dropdown {position:absolute;right:22px;top:62px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-lg);min-width:230px;padding:8px;z-index:60}#kn-root .dropdown .who {padding:10px 12px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}#kn-root .dropdown .who b {display:block;font-size:15px}#kn-root .dropdown .who span {font-size:12.5px;color:var(--ink-faint)}#kn-root .dropdown button {display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:none;border:none;
  padding:10px 12px;border-radius:9px;font-size:14.5px;color:var(--ink)}#kn-root .dropdown button:hover {background:var(--paper-2)}/* ============ landing ============ */#kn-root .hero {position:relative;overflow:hidden}#kn-root .hero .wrap {padding-top:64px;padding-bottom:54px}#kn-root .eyebrow {font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--amber-deep);font-weight:600;margin-bottom:20px}#kn-root .hero h1 {font-size:clamp(40px,7vw,74px);font-weight:600;max-width:14ch}#kn-root .hero h1 em {font-style:italic;color:var(--amber)}#kn-root .hero p.lede {font-size:clamp(17px,2.3vw,21px);color:var(--ink-soft);max-width:54ch;margin:24px 0 32px;line-height:1.5}#kn-root .hero-cta {display:flex;gap:12px;flex-wrap:wrap;align-items:center}#kn-root .hero-note {font-size:13.5px;color:var(--ink-faint);margin-top:16px;display:flex;gap:8px;align-items:center}#kn-root .hero-deco {position:absolute;right:-40px;top:40px;width:46%;max-width:560px;pointer-events:none;opacity:.96}@media(max-width:900px) {#kn-root .hero-deco {display:none}}/* fellowship strip */#kn-root .strip {background:var(--ink);color:var(--paper)}#kn-root .strip .wrap {display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding:30px 22px}#kn-root .strip .stat b {font-family:var(--display);font-size:30px;display:block;line-height:1}#kn-root .strip .stat span {font-size:13px;color:#C9BEAA}@media(max-width:760px) {#kn-root .strip .wrap {grid-template-columns:repeat(2,1fr);gap:20px}}/* how it works */#kn-root .section {padding:74px 0}#kn-root .section-head {max-width:60ch;margin-bottom:42px}#kn-root .section-head .eyebrow {margin-bottom:14px}#kn-root .section-head h2 {font-size:clamp(28px,4vw,42px)}#kn-root .section-head p {color:var(--ink-soft);font-size:17px;margin-top:14px}#kn-root .steps {display:grid;grid-template-columns:repeat(3,1fr);gap:20px}#kn-root .step {background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;position:relative}#kn-root .step .n {font-family:var(--mono);font-size:13px;color:var(--amber-deep);font-weight:600}#kn-root .step h3 {font-size:20px;margin:14px 0 8px}#kn-root .step p {color:var(--ink-soft);font-size:15px;margin:0}#kn-root .steps.fellow .step .n {color:var(--spine-deep)}@media(max-width:820px) {#kn-root .steps {grid-template-columns:1fr}}/* feature cards */#kn-root .features {display:grid;grid-template-columns:repeat(2,1fr);gap:18px}#kn-root .feat {display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}#kn-root .feat .ic {width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:22px;
  background:var(--amber-wash)}#kn-root .feat.green .ic {background:var(--spine-wash)}#kn-root .feat h3 {font-size:18px;margin-bottom:6px}#kn-root .feat p {color:var(--ink-soft);font-size:14.5px;margin:0}@media(max-width:760px) {#kn-root .features {grid-template-columns:1fr}}/* compare table */#kn-root .compare {background:var(--paper-2)}#kn-root .cmp {width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}#kn-root .cmp th, #kn-root .cmp td {padding:16px 18px;text-align:left;border-bottom:1px solid var(--line-soft);font-size:15px}#kn-root .cmp th {font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}#kn-root .cmp td.koin {background:var(--amber-wash);font-weight:600}#kn-root .cmp tr:last-child td {border-bottom:none}/* quote */#kn-root .quote {text-align:center;max-width:48ch;margin:0 auto}#kn-root .quote p {font-family:var(--display);font-size:clamp(22px,3.4vw,32px);font-style:italic;line-height:1.3}#kn-root .quote cite {display:block;margin-top:18px;font-style:normal;font-size:14px;color:var(--ink-faint);font-family:var(--body)}/* final cta */#kn-root .cta-band {background:var(--ink);color:var(--paper);border-radius:24px;padding:54px;text-align:center}#kn-root .cta-band h2 {font-size:clamp(28px,4.2vw,44px);color:#fff}#kn-root .cta-band p {color:#CDC2AD;max-width:48ch;margin:16px auto 28px;font-size:17px}/* footer */#kn-root footer {border-top:1px solid var(--line);padding:44px 0;color:var(--ink-faint);font-size:14px}#kn-root footer .wrap {display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}/* ============ auth modal ============ */#kn-root .overlay {position:fixed;inset:0;background:rgba(36,31,25,.5);backdrop-filter:blur(3px);z-index:80;
  display:grid;place-items:center;padding:20px}#kn-root .modal {background:var(--paper);border-radius:22px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);
  border:1px solid var(--line);overflow:hidden;max-height:92vh;overflow-y:auto}#kn-root .modal .m-head {padding:26px 28px 6px;position:relative}#kn-root .modal .m-head .x {position:absolute;right:18px;top:18px;background:var(--paper-2);border:none;border-radius:50%;
  width:34px;height:34px;font-size:17px;color:var(--ink-soft)}#kn-root .modal .m-head h3 {font-size:24px}#kn-root .modal .m-head p {color:var(--ink-soft);font-size:14.5px;margin-top:6px}#kn-root .modal .m-body {padding:8px 28px 28px}#kn-root .tabs {display:flex;gap:6px;background:var(--paper-2);padding:5px;border-radius:12px;margin:14px 0 18px}#kn-root .tabs button {flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft)}#kn-root .tabs button.active {background:#fff;color:var(--ink);box-shadow:var(--shadow)}#kn-root .field {margin-bottom:14px}#kn-root .field label {display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft)}#kn-root .field input, #kn-root .field textarea, #kn-root .field select {width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;

  transition:.15s}#kn-root .role-pick .opt.sel {border-color:var(--amber);background:var(--amber-wash)}#kn-root .role-pick .opt.sel.author {border-color:var(--spine);background:var(--spine-wash)}#kn-root .role-pick .opt .ic {font-size:24px}#kn-root .role-pick .opt b {display:block;font-size:14.5px;margin-top:6px}#kn-root .role-pick .opt span {font-size:12px;color:var(--ink-faint)}#kn-root .g-btn {display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;font-weight:600;font-size:14.5px;margin-bottom:14px}#kn-root .g-btn:hover {background:var(--paper-2)}#kn-root .divider {display:flex;align-items:center;gap:12px;color:var(--ink-faint);font-size:12.5px;margin:14px 0}#kn-root .divider::before, #kn-root .divider::after {content:"";flex:1;height:1px;background:var(--line)}#kn-root .err {color:var(--amber-deep);font-size:13px;margin-top:-6px;margin-bottom:10px}/* ============ app shell ============ */#kn-root .app {padding:30px 0 80px}#kn-root .app-head {display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}#kn-root .app-head h1 {font-size:clamp(26px,4vw,36px)}#kn-root .app-head p {color:var(--ink-soft);margin-top:6px}#kn-root .subnav {display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}#kn-root .subnav button {border:none;background:none;padding:12px 4px;margin-right:18px;font-weight:600;font-size:15px;
  color:var(--ink-faint);border-bottom:2.5px solid transparent;white-space:nowrap}#kn-root .subnav button.active {color:var(--ink);border-color:var(--amber)}#kn-root .author-mode .subnav button.active {border-color:var(--spine)}/* book grid */#kn-root .grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}#kn-root .book {background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;
  flex-direction:column;transition:.18s;cursor:pointer}#kn-root .book:hover {transform:translateY(-3px);box-shadow:var(--shadow)}#kn-root .cover {aspect-ratio:3/4.1;display:flex;flex-direction:column;justify-content:space-between;padding:18px;position:relative;color:#fff}#kn-root .cover .k {font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.8;text-transform:uppercase}#kn-root .cover .ct {font-family:var(--display);font-size:22px;font-weight:600;line-height:1.12;text-shadow:0 1px 12px rgba(0,0,0,.18)}#kn-root .cover .ca {font-size:13px;opacity:.92}#kn-root .cover .badge {position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);color:var(--amber-deep);
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}#kn-root .book .meta {padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}#kn-root .book .meta .row {display:flex;justify-content:space-between;align-items:center;gap:8px}#kn-root .book .meta .ttl {font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}#kn-root .book .meta .by {font-size:13px;color:var(--ink-soft)}#kn-root .countdown {font-family:var(--mono);font-size:12px;font-weight:600;color:var(--amber-deep)}#kn-root .countdown.closed {color:var(--ink-faint)}/* detail */#kn-root .detail {display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}@media(max-width:760px) {#kn-root .detail {grid-template-columns:1fr}}#kn-root .detail .cover {border-radius:var(--r);aspect-ratio:3/4.2;box-shadow:var(--shadow)}#kn-root .detail h1 {font-size:clamp(28px,5vw,40px);margin:4px 0 10px}#kn-root .detail .blurb {font-size:16.5px;color:var(--ink-soft);line-height:1.6;margin:18px 0}#kn-root .detail .actions {display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}#kn-root .panel {background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:22px}#kn-root .panel h3 {font-size:17px;margin-bottom:6px}#kn-root .panel p.sub {color:var(--ink-soft);font-size:14px;margin:0 0 14px}#kn-root .author-card {display:flex;gap:14px;align-items:center;background:var(--spine-wash);border:1px solid #CFE0D8;

  align-items:center;gap:10px;cursor:pointer}#kn-root .thread .t-head b {font-size:15px}#kn-root .thread .t-head span {font-size:12.5px;color:var(--ink-faint)}#kn-root .bubbles {padding:16px 18px;display:flex;flex-direction:column;gap:12px}#kn-root .bubble {max-width:78%;padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.5}#kn-root .bubble.reader {align-self:flex-start;background:var(--amber-wash);border-bottom-left-radius:4px}#kn-root .bubble.author {align-self:flex-end;background:var(--spine-wash);border-bottom-right-radius:4px}#kn-root .bubble .who {font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-bottom:3px}#kn-root .reply-box {display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft)}#kn-root .reply-box input {flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:999px;font-family:inherit;font-size:14px}/* empty states */#kn-root .empty {text-align:center;padding:60px 20px;color:var(--ink-faint)}#kn-root .empty .ic {font-size:40px;margin-bottom:14px}#kn-root .empty h3 {font-size:20px;color:var(--ink-soft);margin-bottom:6px}#kn-root .empty p {max-width:42ch;margin:0 auto 18px}/* profile */#kn-root .profile-head {display:flex;gap:22px;align-items:center;margin-bottom:8px;flex-wrap:wrap}#kn-root .profile-head .big-av {width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;

rcle-card p {font-size:13.5px;color:var(--ink-soft);margin:0}/* ---------- The Epigraph ---------- */#kn-root .epigraph {background:linear-gradient(140deg,#fffdf7,#fbf3e2);border:1px solid var(--gold);border-radius:var(--r);

<script>

/* ====================================================================
   KOINITA BOOK CLUB — front-end prototype
   Persistence: localStorage (works when you download/deploy this file;
   in the Claude preview it may reset). Wire to Supabase for production.
   ==================================================================== */

const KEY = 'koinita_v6';
const COVERS = [
  ['#2E5E4E','#1F4438'],['#D9541F','#A83B0F'],['#3A3D8C','#26285C'],
  ['#8C2F4A','#5E1E31'],['#1F6F7A','#114049'],['#7A5A2E','#4E3A1C'],
  ['#5B3A8C','#3A2459'],['#2B6B45','#194229'],['#B5862F','#7A5A1C']
];
const AVS = ['#D9541F','#2E5E4E','#3A3D8C','#8C2F4A','#1F6F7A','#7A5A2E','#5B3A8C','#B5862F'];
const GENRES = ['Literary Fiction','Mystery','Sci-Fi','Romance','Non-Fiction','Self-Growth','Fantasy','Thriller','History'];

/* ====================================================================
   MONETIZATION HOOKS  (built now, dormant at launch)
   --------------------------------------------------------------------
   MODEL (NetGalley-style): readers are ALWAYS free, with no gate, ever.
   Money comes from the author side only. Every gate below already exists
   in the code; at launch MONETIZATION_ENABLED is false, so every author
   gets full access. Flipping it to true enforces the tiers — a config
   change, not a rebuild.

   PRODUCTION BILLING: Supabase doesn't bill on its own. Enable the Stripe
   wrapper in the Supabase dashboard, create one Edge Function that opens a
   Stripe Checkout Session, and let a Stripe webhook write the resulting
   plan back to the author's `author_plan` column. The helpers below
   (planOf / gatesActive / canAddBook / hasFeature) are the single place
   that reads `author_plan` — point them at the synced column and the whole
   app gates correctly.
   ==================================================================== */
const MONETIZATION_ENABLED = false;     // ← launch = false. Set true to switch tiers on.
let   monetizationPreview   = false;     // dev-only runtime preview; never affects real members.

const PLANS = {
  starter: { id:'starter', name:'Starter',      price:0,  period:'',    accent:'var(--ink-soft)',
    tagline:'Get your first book in front of real readers.',
    maxListings:1,  analytics:false, featured:false, readerTeam:25,   prioritySupport:false },
  indie:   { id:'indie',   name:'Indie Author',  price:19, period:'/mo', accent:'var(--amber)',
    tagline:'For working authors building a readership.',
    maxListings:5,  analytics:true,  featured:false, readerTeam:150,  prioritySupport:false },
  pro:     { id:'pro',     name:'Author Pro',    price:49, period:'/mo', accent:'var(--spine)',
    tagline:'Maximum reach, data, and featured placement.',
    maxListings:25, analytics:true,  featured:true,  readerTeam:1000, prioritySupport:true }
};
const INHOUSE_PLAN = { id:'inhouse', name:'Axitos (In-House)', price:0, period:'', accent:'var(--gold)',
  tagline:'Published by Axitos — full access, always free.',
  maxListings:Infinity, analytics:true, featured:true, readerTeam:Infinity, prioritySupport:true };

function gatesActive(u){ return (MONETIZATION_ENABLED || monetizationPreview) && u && u.role==='author' && !u.inhouse; }
function planOf(u){ if(!u||u.role!=='author') return null; if(u.inhouse) return INHOUSE_PLAN; return PLANS[u.plan||'starter']; }
function listingLimit(u){ return gatesActive(u)? planOf(u).maxListings : Infinity; }
function listingsUsed(u){ return DB.books.filter(b=>b.authorUserId===u.id).length; }
function canAddBook(u){ return listingsUsed(u) < listingLimit(u); }
function hasFeature(u,key){ if(!gatesActive(u)) return true; return !!planOf(u)[key]; }

/* ---------- store ---------- */
function blankDB(){ return {users:[], books:[], threads:[], follows:[], posts:[], notifications:[], circles:[], appeals:[], reports:[], settings:{staffEditorName:'Staff Editor', autoApprove:true, foundingCap:25000, founderCount:0}, session:null, seeded:false}; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d&&d.seeded) return d; }catch(e){}
  const d = seed(); save(d); return d;
}
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let DB = null;
const uid = (p='id')=> p+'_'+Math.random().toString(36).slice(2,9);
const now = ()=> Date.now();
const me = ()=> DB.users.find(u=>u.id===DB.session) || null;
const userById = id=> DB.users.find(u=>u.id===id);
const bookById = id=> DB.books.find(b=>b.id===id);
const circleById = id=> DB.circles.find(c=>c.id===id);

/* ---------- literary-network helpers ----------
   Feed uses the pull model: posts are stored once and a follower's feed is a
   single query over the accounts they follow (no fan-out write storm).
   Notifications are a table read on load + (in production) an email digest —
   never a per-user realtime socket, which keeps concurrent-connection cost flat. */
function isFollowing(a,b){ return DB.follows.some(f=>f.followerId===a && f.followeeId===b); }
function followersOf(id){ return DB.follows.filter(f=>f.followeeId===id).map(f=>f.followerId); }
function followingOf(id){ return DB.follows.filter(f=>f.followerId===id).map(f=>f.followeeId); }
function notify(userId, type, fromId, text, refId){
  if(!userId || userId===fromId) return;
  DB.notifications.push({id:uid('n'), userId, type, fromId, refId, text, at:now(), read:false});
}
function unreadCount(){ const m=me(); return m? DB.notifications.filter(n=>n.userId===m.id && !n.read).length : 0; }
function toggleFollow(id){
  const m=me(); if(!m || id===m.id) return;
  const i = DB.follows.findIndex(f=>f.followerId===m.id && f.followeeId===id);
  if(i>=0){ DB.follows.splice(i,1); }
  else { DB.follows.push({followerId:m.id, followeeId:id, at:now()}); notify(id,'follow',m.id,'started following you',m.id);
    save(DB);
    if(!m.pushPrimed){ const t=userById(id); maybePrimePush(`We'll let you know the moment ${t?t.name.split(' ')[0]:'they'} drops a new free book or posts a note.`); return; }
  }
  save(DB); render();
}

/* ---------- staff editor + admin + mute ---------- */
function staffEditor(){ return DB.users.find(u=>u.system) || null; }
function isAdmin(){ const m=me(); return !!(m && m.admin); }
function isMutedStaff(){ const m=me(); return !!(m && m.mutedStaff); }
function toggleMuteStaff(){ const m=me(); m.mutedStaff=!m.mutedStaff; save(DB);
  toast(m.mutedStaff?'Muted — you can turn these back on in settings':'Staff updates back on'); render(); }

/* ---------- moderation + strikes ----------
   Tier A (illegal / child-safety / credible threats): zero tolerance — block,
   permanent ban, preserve, and (in production) file an NCMEC CyberTipline report.
   Tier B (adult, abuse, fraud, spam, solicitation): warn once, ban on repeat.
   PROTOTYPE heuristic — production replaces with OpenAI Moderation + a child-safety
   text classifier (e.g., Thorn Safer) running server-side before insert. */
function classify(text){
  const t=(text||''); const l=t.toLowerCase();
  const tierA=['child porn','cp ','underage','minor sex','rape','kill you','bomb','school shoot','sextort'];
  if(tierA.some(w=>l.includes(w))) return {tier:'A', reason:'This violates our zero-tolerance safety policy. Your account has been suspended and the content preserved for reporting.'};
  const tierB=['viagra','crypto airdrop','free money','click here to win','make money fast','sex chat','xxx','onlyfans','nudes','buy now cheap'];
  if(tierB.some(w=>l.includes(w))) return {tier:'B', reason:'That looks like adult, spam, or solicitation content, which isn\u2019t allowed here.'};
  const letters=t.replace(/[^A-Za-z]/g,'');
  if(letters.length>20 && (t.replace(/[^A-Z]/g,'').length/letters.length)>0.85) return {tier:'B', reason:'Please don\u2019t post in all caps.'};
  return {tier:'ok'};
}
// returns {ok, clean} or {ok:false} after applying enforcement + UI feedback
function enforce(text){
  const m=me();
  const c=classify(text);
  if(c.tier==='ok'){
    const clean=(text||'').replace(/\bhttps?:\/\/\S+|\bwww\.\S+|\b[\w-]+\.(com|net|org|io|co|ru|xyz|link|info|biz)\b\S*/gi,'[link removed]');
    return {ok:true, clean};
  }
  if(c.tier==='A'){
    m.banned=true; m.banReason='Tier A safety violation'; m.strikes=(m.strikes||0)+1;
    DB.reports.push({id:uid('r'), userId:m.id, tier:'A', text:'[preserved]', at:now(), status:'reported_ncmec'});
    save(DB); toast(c.reason); render(); return {ok:false};
  }
  // Tier B: warn first, ban on second
  m.strikes=(m.strikes||0)+1;
  if(m.strikes>=2){ m.banned=true; m.banReason='Repeat Tier B violation'; save(DB); toast('Removed. Second violation — your account is suspended.'); render(); return {ok:false}; }
  save(DB); toast('Removed and warning issued: '+c.reason+' One more and your account is suspended.'); render(); return {ok:false};
}

/* ---------- seed demo data ---------- */
function seed(){
  const d = blankDB();
  const staff = {id:uid('u'), name:'Staff Editor', email:'editor@koinita.club', role:'author', system:true, admin:true,
    inhouse:true, plan:'inhouse', avatar:AVS[5], bio:'Notes and announcements from the Koinita team. Every member sees these by default — you can mute them anytime.', joined:now()-1000*60*60*24*60, shelf:[], strikes:0, banned:false, age18:true};
  const admin = {id:uid('u'), name:'Owner (Admin)', email:'admin@koinita.club', role:'author', admin:true,
    inhouse:true, plan:'inhouse', avatar:AVS[7], bio:'Koinita owner account.', joined:now()-1000*60*60*24*60, shelf:[], strikes:0, banned:false, age18:true};
  const author1 = {id:uid('u'),name:'Mara Ellison',email:'mara@demo.club',role:'author', inhouse:true, plan:'inhouse',
    avatar:AVS[1], bio:'I write quiet literary fiction about ordinary people at turning points. Koinita is where I meet my first readers and listen.', joined:now()-1000*60*60*24*40, shelf:[], strikes:0, banned:false, age18:true};
  const author2 = {id:uid('u'),name:'Daniel Okafor',email:'daniel@demo.club',role:'author', inhouse:false, plan:'indie',
    avatar:AVS[4], bio:'Speculative fiction and near-future thrillers. I read every note my readers send and I answer all of them.', joined:now()-1000*60*60*24*30, shelf:[], strikes:0, banned:false, age18:true};
  const reader1 = {id:uid('u'),name:'Reader Demo',email:'reader@demo.club',role:'reader',
    avatar:AVS[2], bio:'Avid reader. Happiest finding a great book before everyone else does.', joined:now()-1000*60*60*24*10, shelf:[], strikes:0, banned:false, age18:true};
  d.users.push(staff,admin,author1,author2,reader1);
  d.staffEditorId = staff.id;

  const t = now();
  const day = 1000*60*60*24;
  const mk = (title,authorName,authorId,genre,blurb,ci,freeStart,freeEnd,asin)=>({
    id:uid('b'),title,authorName,authorUserId:authorId,genre,blurb,cover:ci,
    freeStart,freeEnd,asin, amazonUrl:'https://www.amazon.com/dp/'+asin, added:t});

  d.books.push(
    mk('The Last Light Keeper','Mara Ellison',author1.id,'Literary Fiction',
      'On a fog-bound island, the keeper of a decommissioned lighthouse meets the woman who once lived in the cottage below. A first-edition release about memory, tides, and what we choose to keep lit.',
      0, t-day, t+day*3, 'B0EXAMPLE1'),
    mk('Signal Garden','Daniel Okafor',author2.id,'Sci-Fi',
      'In 2049 a botanist discovers her greenhouse is quietly transmitting. A taut near-future story about listening, consent, and the things we grow without meaning to.',
      2, t-day*2, t+day, 'B0EXAMPLE2'),
    mk('Salt & Ledger','Mara Ellison',author1.id,'Historical',
      'A bookkeeper in a failing coastal town balances the accounts of a community that no longer balances. Honest, warm, unsentimental.',
      5, t+day*2, t+day*7, 'B0EXAMPLE3'),
    mk('The Quiet Algorithm',null,null,'Non-Fiction',
      'A plain-language field guide to making good decisions when the data is loud and the stakes are real. Author profile unclaimed — connect this book to its author.',
      3, t-day, t+day*2, 'B0EXAMPLE4'),
    mk('Hollowmere','Daniel Okafor',author2.id,'Fantasy',
      'A drowned city resurfaces once a generation, and this year it is early. Atmospheric, propulsive fantasy with a beating human heart.',
      6, t-day*4, t-day, 'B0EXAMPLE5'),
    mk('Small Repairs','Mara Ellison',author1.id,'Self-Growth',
      'Short essays on fixing the small things — a hinge, a habit, a half-said apology — and how they add up to a life.',
      7, t+day*4, t+day*9, 'B0EXAMPLE6')
  );

  // one demo thread so the inbox isn't empty
  d.threads.push({
    id:uid('t'), bookId:d.books[0].id, readerId:reader1.id, authorUserId:author1.id,
    subject:'Feedback on The Last Light Keeper',
    rating:5, liked:'The final chapter completely undid me — the restraint in the prose made it hit harder.',
    improve:'The middle stretch on the island felt a touch slow, but it paid off.',
    messages:[{from:'reader',userId:reader1.id,text:'Was the lighthouse meant to be literal or a memory? No spoilers needed — just curious how you think about it.',at:t-day*1.5}],
    created:t-day*1.5, updated:t-day*1.5
  });

  // ---- literary network seed ----
  d.follows.push(
    {followerId:reader1.id, followeeId:author1.id, at:t-day*8},
    {followerId:reader1.id, followeeId:author2.id, at:t-day*6},
    {followerId:author2.id, followeeId:author1.id, at:t-day*5},
    // every member auto-follows the Staff Editor (system account)
    {followerId:reader1.id, followeeId:staff.id, at:t-day*10, staff:true},
    {followerId:author1.id, followeeId:staff.id, at:t-day*10, staff:true},
    {followerId:author2.id, followeeId:staff.id, at:t-day*10, staff:true}
  );
  d.posts.push(
    {id:uid('p'), authorId:staff.id, bookId:null, text:'Welcome to Koinita. We are a small, quiet club for readers and the authors who write for them. Free books, honest feedback, real conversation — no noise, no ads, no AI slop. We will use this space, sparingly, for the occasional note. You can mute it anytime.', at:t-day*9, appreciatedBy:[reader1.id], pinned:true},
    {id:uid('p'), authorId:author1.id, bookId:d.books[0].id, text:'A note from behind the page: I wrote the keeper during a winter I spent near a real decommissioned lighthouse. What it means to me is that we keep tending things long after their official use is gone. That is most of love, I think.', at:t-day*2, appreciatedBy:[reader1.id]},
    {id:uid('p'), authorId:author2.id, bookId:d.books[1].id, text:'Signal Garden started as a question: what would it mean to be listened to completely, without consent? I kept the prose spare on purpose. Curious what my first readers make of the ending.', at:t-day*1, appreciatedBy:[]},
    {id:uid('p'), authorId:author1.id, bookId:null, text:'Reading is the one technology that still requires your whole attention. That is why this club is small and quiet on purpose.', at:t-day*0.5, appreciatedBy:[]}
  );
  const circle = {id:uid('c'), bookId:d.books[0].id, ownerId:author1.id, name:'The Last Light Keeper — first readers',
    memberIds:[author1.id, reader1.id], at:t-day*3,
    messages:[{userId:author1.id, text:'Welcome in. This is a small circle for the first people reading the book. Ask me anything as you go.', at:t-day*3}]};
  d.circles.push(circle);
  d.notifications.push(
    {id:uid('n'), userId:author1.id, type:'follow', fromId:reader1.id, refId:author1.id, text:'started following you', at:t-day*8, read:false},
    {id:uid('n'), userId:reader1.id, type:'circle_add', fromId:author1.id, refId:circle.id, text:'added you to a reading circle', at:t-day*3, read:false}
  );

  // ---- founding members + invite codes + notif prefs + book status ----
  let fno=1;
  d.users.forEach(u=>{
    u.inviteCode = u.inviteCode || (u.name.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+Math.floor(100+Math.random()*900));
    u.invites = u.invites||0; u.charter = !!u.charter;
    u.notifPrefs = u.notifPrefs || {email:true, push:false}; u.pushPrimed = true;
    if(!u.system){ u.founder=true; u.founderNo=fno++; }
  });
  reader1.invites=3; // demo: a few successful invites
  d.settings.founderCount = fno-1;
  d.books.forEach(b=>{ b.status='approved'; });

  d.seeded = true;
  return d;
}

/* ---------- helpers ---------- */
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2600); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function timeAgo(ts){ const s=(now()-ts)/1000; if(s<60)return'just now'; const m=s/60; if(m<60)return Math.floor(m)+'m ago';
  const h=m/60; if(h<24)return Math.floor(h)+'h ago'; const d=h/24; if(d<30)return Math.floor(d)+'d ago'; return Math.floor(d/30)+'mo ago'; }
function freeState(b){ const t=now();
  if(t<b.freeStart) return {state:'soon', txt:'Drops '+new Date(b.freeStart).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
  if(t<=b.freeEnd){ const left=b.freeEnd-t; const days=Math.floor(left/86400000); const hrs=Math.floor((left%86400000)/3600000);
    return {state:'live', txt: days>0 ? `Free · ${days}d ${hrs}h left` : `Free · ${hrs}h left`}; }
  return {state:'closed', txt:'Window closed'};
}
function coverStyle(ci){ const c=COVERS[ci%COVERS.length]; return `background:linear-gradient(150deg,${c[0]},${c[1]})`; }

function epigraphToday(){
  const epoch = Math.floor(Date.now()/86400000); // day index
  return EPIGRAPHS[epoch % EPIGRAPHS.length];
}
function epigraphCard(compact){
  const e = epigraphToday();
  const today = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  return `<div class="epigraph${compact?' compact':''}">
    <div class="epi-tag">The Epigraph · ${today}</div>
    <blockquote>“${esc(e.q)}”</blockquote>
    <div class="epi-by">— ${esc(e.a)}${e.w?`, <i>${esc(e.w)}</i>`:''}</div>
    <button class="epi-share" onclick="shareEpigraph()">↗ Share today's line</button>
  </div>`;
}
function shareEpigraph(){
  const e = epigraphToday();
  shareThing('The Epigraph — today on Koinita', `“${e.q}” — ${e.a}${e.w?', '+e.w:''}`, location.href);
}

/* ====================================================================
   SHARE — Web Share API with graceful fallback (copy / email / socials)
   ==================================================================== */
function shareThing(title, text, url){
  url = url || location.href;
  if(navigator.share){
    navigator.share({title, text, url}).catch(()=>{});
    return;
  }
  const enc=encodeURIComponent, body=enc(text+'\n\n'+url);
  document.getElementById('modalMount').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeAuth()">
    <div class="modal">
      <div class="m-head"><button class="x" onclick="closeAuth()">✕</button>
        <h3>Share</h3><p>${esc(title)}</p></div>
      <div class="m-body">
        <div class="share-row">
          <button onclick="copyText(${JSON.stringify(text+' '+url).replace(/"/g,'&quot;')})">🔗 Copy</button>
          <a class="sbtn" href="mailto:?subject=${enc(title)}&body=${body}">✉ Email</a>
          <a class="sbtn" href="https://wa.me/?text=${body}" target="_blank" rel="noopener">WhatsApp</a>
          <a class="sbtn" href="https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}" target="_blank" rel="noopener">X</a>
          <a class="sbtn" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}" target="_blank" rel="noopener">Facebook</a>
        </div>
        <div class="quote-card" id="quoteCard"><div class="qc-body">${esc(text)}</div><div class="qc-brand">Koinita<span class="qc-dot"></span></div></div>
        <p style="font-size:12px;color:var(--ink-faint);text-align:center;margin:10px 0 0">A quote card like this is generated for social — books grow on shares.</p>
      </div>
    </div>
  </div>`;
}
function copyText(t){ navigator.clipboard?.writeText(t); toast('Copied — paste it anywhere'); }

  renderNav();

    case 'notifications': html = viewNotifications(); break;
    case 'circles': html = viewCircles(); break;

    case 'shelf': html = viewShelf(); break;
    case 'messages': html = viewMessages(); break;
    case 'inbox': html = viewInbox(); break;

function mountCodeStep(){
  document.getElementById('modalMount').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeAuth()">
    <div class="modal">
      <div class="m-head"><button class="x" onclick="closeAuth()">✕</button>

          <input id="af_code" inputmode="numeric" maxlength="6" placeholder="••••••" style="letter-spacing:8px;font-size:22px;text-align:center" autofocus></div>
        <div class="err hidden" id="af_err"></div>
        <button class="btn btn-amber btn-block" onclick="verifyCode()">Verify &amp; continue</button>
        <p style="font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:12px">Demo: enter any 6 digits. <button class="linkbtn" style="background:none;border:none;color:var(--amber-deep);font-weight:600;padding:0;cursor:pointer" onclick="authState.step='form';mountAuth()">Use a different email</button></p>
      </div>
    </div>
  </div>`;
}
function switchAuth(mode){ authState.mode=mode; authState.step='form'; mountAuth(); }
function pickRole(r){ authState.role=r; mountAuth(); }
function closeAuth(){ document.getElementById('modalMount').innerHTML=''; }

function socialAuth(provider){
  // Demo only — production uses Supabase OAuth (Google / Apple), passwordless by design.
  const label = provider==='apple'?'Apple':'Google';
  if(authState.mode==='signin'){
    const u = DB.users.find(x=>x.role==='reader' && !x.system);
    if(u.banned){ DB.session=u.id; save(DB); closeAuth(); render(); return; }
    DB.session=u.id; save(DB); closeAuth(); toast('Signed in with '+label+' (demo)'); afterAuth(); return;
  }
  finishSignup(label+' Member', 'member'+Math.floor(Math.random()*9000)+'@'+(provider==='apple'?'icloud.com':'gmail.com'), authState.role);
}
function submitAuth(e){
  e.preventDefault();
  const err = document.getElementById('af_err');
  const email = document.getElementById('af_email').value.trim().toLowerCase();
  if(authState.mode==='signup'){
    if(!document.getElementById('af_age').checked){ err.textContent='You must confirm you are 18 or older to join.'; err.classList.remove('hidden'); return false; }
    if(DB.users.find(x=>x.email===email)){ err.textContent='That email is already in the club. Try signing in.'; err.classList.remove('hidden'); return false; }
    authState.name = document.getElementById('af_name').value.trim();
  } else {
    if(!DB.users.find(x=>x.email===email)){ err.textContent='No account for that email. Try the demo logins, or create an account.'; err.classList.remove('hidden'); return false; }
  }
  authState.email = email; authState.step='code'; mountAuth();
  return false;
}
function verifyCode(){
  const err=document.getElementById('af_err');
  const code=(document.getElementById('af_code').value||'').trim();
  if(!/^\d{6}$/.test(code)){ err.textContent='Enter the 6-digit code (any 6 digits in this demo).'; err.classList.remove('hidden'); return; }
  if(authState.mode==='signin'){
    const u=DB.users.find(x=>x.email===authState.email);
    DB.session=u.id; save(DB); closeAuth();
    if(u.banned){ render(); return; }
    toast('Welcome back, '+u.name.split(' ')[0]); afterAuth(); return;
  }
  finishSignup(authState.name, authState.email, authState.role);
}
function finishSignup(name,email,role){
  const u = {id:uid('u'),name,email,role,avatar:AVS[Math.floor(Math.random()*AVS.length)],
    bio: role==='author'?'New Koinita author. Say hello to your first readers.':'New member of the club.',
    joined:now(), shelf:[], inhouse:false, plan:'starter', strikes:0, banned:false, age18:true, mutedStaff:false,
    inviteCode:name.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+Math.floor(100+Math.random()*900),
    invites:0, charter:false, notifPrefs:{email:true, push:false}, pushPrimed:false};
  // numbered founding membership while spots remain
  if(DB.settings.founderCount < DB.settings.foundingCap){
    DB.settings.founderCount += 1; u.founder=true; u.founderNo=DB.settings.founderCount;
  } else { u.founder=false; }
  // credit the referrer if they arrived via an invite link
  if(authState.inviteCode){
    const ref=DB.users.find(x=>x.inviteCode===authState.inviteCode);
    if(ref){ ref.invites=(ref.invites||0)+1; notify(ref.id,'invite',u.id,'joined from your invite — you moved up the Founders\u2019 Wall',ref.id); }
  }
  DB.users.push(u); DB.session=u.id;
  const se=staffEditor(); if(se) DB.follows.push({followerId:u.id, followeeId:se.id, at:now(), staff:true});
  save(DB); closeAuth();
  toast(u.founder?`Welcome, Founding Member №${u.founderNo} ✦`:`Welcome to Koinita, ${name.split(' ')[0]}!`);
  authState.inviteCode=null; afterAuth();
}
function afterAuth(){ const pv=authState.pendingView; authState.pendingView=null; go(pv||'home'); }
function signOut(){ closeMenu(); DB.session=null; save(DB); toast('Signed out'); go('home'); }

/* Automated moderation gate (prototype heuristic).
   PRODUCTION: replace with a server-side call to the OpenAI Moderation
   endpoint (free) before insert; flagged → block with a rephrase prompt.
   Links are stripped because they're the main spam payload. */
function moderate(text){
  const t = text||'';
  const stripped = t.replace(/\bhttps?:\/\/\S+|\bwww\.\S+|\b[\w-]+\.(com|net|org|io|co|ru|xyz|link|info|biz)\b\S*/gi,'[link removed]');
  const linkRemoved = stripped!==t;
  const lower = t.toLowerCase();
  const banned = ['viagra','crypto airdrop','free money','click here to win','make money fast','kill yourself','sex chat'];
  if(banned.some(w=>lower.includes(w))) return {ok:false, reason:'That note looks like it may breach our community guidelines. Please rephrase and try again.'};
  const letters = t.replace(/[^A-Za-z]/g,'');
  if(letters.length>20 && (t.replace(/[^A-Z]/g,'').length/letters.length)>0.8) return {ok:false, reason:'Please don\u2019t write in all caps — try again in normal case.'};
  return {ok:true, clean:stripped, linkRemoved};
}

    ? DB.books.filter(b=>b.authorUserId===m.id)

    .concat(claimedBooks.map(b=>`<option value="${b.id}" ${b.id===preBookId?'selected':''}>${esc(b.title)}</option>`)).join('');
  return `<div class="compose">
    <textarea id="postText" maxlength="1000" placeholder="${m.role==='author'?'Share a note from behind the page — what a book means to you…':'Share a short note about a book you\u2019re reading…'}"></textarea>

function createPost(){
  const m=me();
  const text=(document.getElementById('postText').value||'').trim();
  const bookId=document.getElementById('postBook').value||null;
  if(!text){ toast('Write a note first.'); return; }
  const mod=enforce(text);
  if(!mod.ok){ return; }
  DB.posts.push({id:uid('p'), authorId:m.id, bookId, text:mod.clean||text, at:now(), appreciatedBy:[]});

function submitFeedback(bookId){
  const m=me(); const b=bookById(bookId);
  if(!m.shelf.includes(bookId)){ toast('Claim the book first to share feedback.'); return; }
  if(DB.threads.find(t=>t.bookId===bookId && t.readerId===m.id)){ toast('You\u2019ve already shared feedback on this book.'); render(); return; }
  const liked=(document.getElementById('fb_liked').value||'').trim();
  const improve=(document.getElementById('fb_improve').value||'').trim();
  const question=(document.getElementById('fb_question').value||'').trim();
  if(!fbRating && !liked && !improve && !question){ toast('Add a rating or a few words first.'); return; }
  // Automated moderation gate (no human queue) — block & ask to rephrase if flagged
  const mod = enforce([liked,improve,question].join('  '));
  if(!mod.ok){ return; }
  const cLiked=(moderate(liked).clean||'').trim();
  const cImprove=(moderate(improve).clean||'').trim();
  const cQuestion=(moderate(question).clean||'').trim();
  const t={ id:uid('t'), bookId, readerId:m.id, authorUserId:b.authorUserId,
    subject:'Feedback on '+b.title, rating:fbRating, liked:cLiked, improve:cImprove,
    messages:[], created:now(), updated:now() };
  if(cQuestion) t.messages.push({from:'reader', userId:m.id, text:cQuestion, at:now()});
  DB.threads.push(t); fbRating=0;
  if(b.authorUserId) notify(b.authorUserId,'feedback',m.id,'shared feedback on '+b.title,t.id);
  save(DB); toast('Shared with '+userById(b.authorUserId).name.split(' ')[0]+' \u2726'); render();
}

function viewMessages(){ // reader side
  const m=me();

        <button class="btn btn-amber" onclick="go('discover')">Browse books</button></div>`}
  </div></div>`;
}

function viewInbox(){ // author side
  const m=me();

  return `<div class="app author-mode"><div class="wrap">

    ${ts.length? ts.map(t=>threadBlock(t,'author')).join('')

  </div></div>`;
}

function threadBlock(t, sideRole){
  const b = bookById(t.bookId);
  const reader = userById(t.readerId);
  const author = userById(t.authorUserId);
  const last = t.messages[t.messages.length-1];
  const lastFrom = last? last.from : 'reader';
  const open = t._open;
  const otherLabel = sideRole==='author'? esc(reader?reader.name:'Reader') : esc(author?author.name:'Author');
  const stars = (t.rating!=null && t.rating>0)? '★'.repeat(t.rating)+'☆'.repeat(5-t.rating) : '';
  const summary = (stars || t.liked || t.improve)? `
    <div style="padding:14px 18px;border-bottom:1px solid var(--line-soft);background:#fff">
      ${stars?`<div style="color:var(--amber);font-size:18px;letter-spacing:3px;margin-bottom:6px">${stars}</div>`:''}
      ${t.liked?`<p style="margin:0 0 6px;font-size:14px"><b style="color:var(--spine-deep)">What worked:</b> ${esc(t.liked)}</p>`:''}
      ${t.improve?`<p style="margin:0;font-size:14px"><b style="color:var(--amber-deep)">Could be better:</b> ${esc(t.improve)}</p>`:''}
    </div>`:'';
  return `<div class="thread">
    <div class="t-head" onclick="toggleThread('${t.id}')">
      <div><b>${esc(t.subject)}</b><br><span>${esc(b?b.title:'')} · with ${otherLabel} · ${timeAgo(t.updated)}</span></div>
      <span>${open?'▲':'▼'} ${lastFrom!==sideRole?'<span class="chip dot live" style="font-size:10px">new</span>':''}</span>
    </div>
    ${open?`
    ${summary}
    ${t.messages.length?`<div class="bubbles">
      ${t.messages.map(msg=>`
        <div class="bubble ${msg.from}">
          <div class="who">${msg.from==='reader'?esc(reader?reader.name:'Reader'):esc(author?author.name:'Author')}</div>
          ${esc(msg.text)}
          <div style="font-size:11px;opacity:.5;margin-top:4px">${timeAgo(msg.at)}</div>
        </div>`).join('')}
    </div>`:`<div style="padding:14px 18px;color:var(--ink-faint);font-size:13.5px">No question asked — reply to start the conversation.</div>`}
    <div class="reply-box">
      <input id="reply_${t.id}" placeholder="${sideRole==='author'?'Reply to your reader…':'Reply…'}" onkeydown="if(event.key==='Enter')sendReply('${t.id}','${sideRole}')">
      <button class="btn ${sideRole==='author'?'btn-spine':'btn-amber'} btn-sm" onclick="sendReply('${t.id}','${sideRole}')">Send</button>
    </div>`:''}
  </div>`;
}
function toggleThread(id){ const t=DB.threads.find(x=>x.id===id); t._open=!t._open; render(); }
function sendReply(id, sideRole){
  const t=DB.threads.find(x=>x.id===id);
  const input=document.getElementById('reply_'+id);
  const txt=(input.value||'').trim(); if(!txt){ return; }
  const mod=enforce(txt);
  if(!mod.ok){ return; }
  t.messages.push({from:sideRole, userId:DB.session, text:mod.clean||txt, at:now()}); t.updated=now(); t._open=true;
  const target = sideRole==='author'? t.readerId : t.authorUserId;
  notify(target,'reply',DB.session,'replied to your conversation',t.id);
  save(DB); toast('Reply sent'); render();
}

  <div class="overlay" onclick="if(event.target===this)closeAuth()">

      <h3>You've reached your ${p.name} limit</h3>
      <p>Your plan includes ${p.maxListings} active ${p.maxListings===1?'listing':'listings'}. Upgrade to list more books and reach more readers.</p></div>
      <div class="m-body"><button class="btn btn-spine btn-block" onclick="closeAuth();go('plans')">See plans</button></div>
    </div></div>`;
}

function openAddBook(){
  const m=me();
  if(!canAddBook(m)){ openUpgradePrompt(); return; }
  document.getElementById('modalMount').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeAuth()">
    <div class="modal">
      <div class="m-head"><button class="x" onclick="closeAuth()">✕</button>
        <h3>Add a book</h3><p>It will be bound to your author profile and appear on the shelf.</p></div>
      <div class="m-body">
        <div class="field"><label>Title</label><input id="nb_title" placeholder="Your book's title" required></div>
        <div class="field"><label>Genre</label><select id="nb_genre">${GENRES.map(g=>`<option>${g}</option>`).join('')}</select></div>
        <div class="field"><label>Description</label><textarea id="nb_blurb" placeholder="A few honest sentences about the book."></textarea></div>
        <div class="field"><label>Amazon ASIN <span style="font-weight:400;color:var(--ink-faint)">(the 10-character code in the Kindle URL)</span></label><input id="nb_asin" placeholder="B0XXXXXXXX"></div>
        <div class="form-grid">
          <div class="field"><label>Free window starts</label><input id="nb_start" type="date"></div>
          <div class="field"><label>Free window ends</label><input id="nb_end" type="date"></div>
        </div>
        <p style="font-size:12.5px;color:var(--ink-faint);margin:-4px 0 14px">Amazon KDP Select allows up to 5 free days per 90-day term. Set a window inside that.</p>
        <button class="btn btn-spine btn-block" onclick="saveNewBook()">Add to the shelf</button>
      </div>
    </div>
  </div>`;
}
function saveNewBook(){
  const m=me();
  if(!canAddBook(m)){ closeAuth(); openUpgradePrompt(); return; }
  const title=(document.getElementById('nb_title').value||'').trim();
  if(!title){ toast('Give your book a title.'); return; }
  const asin=(document.getElementById('nb_asin').value||'').trim()||'B0EXAMPLE0';
  const s=document.getElementById('nb_start').value, e=document.getElementById('nb_end').value;
  const freeStart = s? new Date(s).getTime() : now();
  const freeEnd = e? new Date(e).getTime()+86399000 : now()+86400000*4;
  // Admin review gate: in-house authors and the auto-approve setting post live;
  // otherwise a new outside-author listing waits for admin approval.
  const auto = DB.settings.autoApprove || m.inhouse || m.admin;
  const status = auto ? 'approved' : 'pending';
  DB.books.push({id:uid('b'),title,authorName:m.name,authorUserId:m.id,
    genre:document.getElementById('nb_genre').value,
    blurb:(document.getElementById('nb_blurb').value||'').trim()||'A new release from '+m.name+'.',
    cover:Math.floor(Math.random()*COVERS.length), featured:false, status,
    freeStart,freeEnd,asin,amazonUrl:'https://www.amazon.com/dp/'+asin,added:now()});
  save(DB); closeAuth();
  toast(status==='approved' ? 'Book added to the shelf ✓' : 'Submitted — pending admin review before it goes live');
  go('mybooks');
}
function viewMyBooks(){
  const m=me();
  const mine=DB.books.filter(b=>b.authorUserId===m.id);
  const canFeature = hasFeature(m,'featured');
  return `<div class="app author-mode"><div class="wrap">
    <div class="app-head"><div><h1>My books</h1><p>Every title here is bound to your author page.</p></div>
      <button class="btn btn-spine btn-sm" onclick="openAddBook()">+ Add a book</button></div>
    ${mine.length?`
      <div class="grid" style="margin-bottom:30px">${mine.map(bookCard).join('')}</div>
      <h2 style="font-size:20px;margin:0 0 14px">Manage your drops</h2>
      <div class="panel" style="padding:4px 0">
        ${mine.map((b,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:13px 20px;${i<mine.length-1?'border-bottom:1px solid var(--line-soft);':''}flex-wrap:wrap">
          <b style="flex:1;min-width:150px;font-family:var(--display);font-size:16px">${esc(b.title)}</b>
          ${b.featured?'<span class="chip" style="background:var(--spine);color:#fff">✦ Featured</span>':''}
          <button class="btn btn-ghost btn-sm" onclick="openEditFree('${b.id}')">Free window</button>
          <button class="btn ${b.featured?'btn-ghost':'btn-spine'} btn-sm" onclick="toggleFeatured('${b.id}')">${b.featured?'Unfeature':(canFeature?'Feature drop':'🔒 Feature')}</button>
        </div>`).join('')}
      </div>`
      :`<div class="empty"><div class="ic">✍️</div><h3>No books yet</h3><p>Add your first title to start meeting readers.</p>
        <button class="btn btn-spine" onclick="openAddBook()">+ Add a book</button></div>`}
  </div></div>`;
}
function toggleFeatured(id){
  const m=me(); const b=bookById(id);
  if(!hasFeature(m,'featured')){ toast('Featured placement is an Author Pro feature.'); go('plans'); return; }
  b.featured=!b.featured; save(DB); toast(b.featured?'Featured ✦':'Removed from featured'); render();
}
function openEditFree(id){
  const b=bookById(id);
  document.getElementById('modalMount').innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeAuth()">
    <div class="modal"><div class="m-head"><button class="x" onclick="closeAuth()">✕</button>
      <h3>Free window</h3><p>${esc(b.title)}</p></div>
      <div class="m-body">
        <div class="form-grid">
          <div class="field"><label>Starts</label><input id="ef_start" type="date" value="${new Date(b.freeStart).toISOString().slice(0,10)}"></div>
          <div class="field"><label>Ends</label><input id="ef_end" type="date" value="${new Date(b.freeEnd).toISOString().slice(0,10)}"></div>
        </div>
        <button class="btn btn-spine btn-block" onclick="saveFree('${id}')">Save window</button>
      </div></div></div>`;
}
function saveFree(id){ const b=bookById(id);
  b.freeStart=new Date(document.getElementById('ef_start').value).getTime();
  b.freeEnd=new Date(document.getElementById('ef_end').value).getTime()+86399000;
  save(DB); closeAuth(); toast('Free window updated'); render(); }

/* ====================================================================
   PLANS & BILLING  (author-side monetization; readers never pay)
   ==================================================================== */
function viewPlans(){
  const m=me();
  const isAuthor = m && m.role==='author';
  const current = isAuthor? planOf(m).id : null;
  const launch = !(MONETIZATION_ENABLED||monetizationPreview);
  const card = (p, highlight)=>`
    <div class="step" style="border-color:${highlight?p.accent:'var(--line)'};border-width:${highlight?'2px':'1px'};position:relative">
      ${current===p.id?`<span class="chip" style="position:absolute;top:-11px;right:16px;background:${p.accent};color:#fff">Your plan</span>`:''}
      <div class="n" style="color:${p.accent}">${p.name.toUpperCase()}</div>
      <div style="font-family:var(--display);font-size:34px;margin:8px 0 2px">${p.price===0?'Free':'$'+p.price}<span style="font-size:14px;color:var(--ink-faint);font-family:var(--body)">${p.period}</span></div>
      <p style="color:var(--ink-soft);font-size:14px;margin:0 0 16px">${p.tagline}</p>
      <ul style="list-style:none;padding:0;margin:0 0 18px;font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:9px">
        <li>📚 ${p.maxListings===Infinity?'Unlimited':p.maxListings} active ${p.maxListings===1?'listing':'listings'}</li>
        <li>${p.analytics?'📈 Reader analytics':'<span style="opacity:.5">No analytics</span>'}</li>
        <li>${p.featured?'✦ Featured placement':'<span style="opacity:.5">Standard placement</span>'}</li>
        <li>👥 Up to ${p.readerTeam===Infinity?'unlimited':p.readerTeam} reader team</li>
        <li>${p.prioritySupport?'⚡ Priority support':'<span style="opacity:.5">Standard support</span>'}</li>
      </ul>
      ${isAuthor && !m.inhouse ? (current===p.id
          ? '<button class="btn btn-ghost btn-block" disabled>Current plan</button>'
          : `<button class="btn ${highlight?'btn-spine':'btn-ghost'} btn-block" onclick="startCheckout('${p.id}')">${p.price===0?'Switch to Free':'Choose '+p.name}</button>`)
        : (isAuthor?'':'<button class="btn btn-amber btn-block" onclick="openAuth(\'signup\',\'author\')">Join as an author</button>')}
    </div>`;
  return `<div class="app author-mode"><div class="wrap">
    <div class="app-head"><div><h1>Plans &amp; billing</h1><p>Readers are always free. These plans are for authors — and they're how Koinita sustains itself.</p></div></div>

    ${launch?`<div class="panel" style="background:var(--spine-wash);border-color:#CFE0D8;margin-top:0">
      <h3 style="color:var(--spine-deep)">✦ Launch mode — everything below is free right now</h3>
      <p class="sub" style="margin:0">Every author feature is unlocked while Koinita grows. These tiers switch on later, and you will never lose access you already have.${m&&m.inhouse?' As an Axitos in-house author, your access stays free, always.':''}</p>
    </div>`:''}

    <div class="steps" style="margin-top:22px">
      ${card(PLANS.starter,false)}
      ${card(PLANS.indie,true)}
      ${card(PLANS.pro,false)}
    </div>

    ${m&&m.inhouse?`<div class="panel"><h3>✦ ${INHOUSE_PLAN.name}</h3><p class="sub" style="margin:0">${INHOUSE_PLAN.tagline} Books published through Axitos get full access at no cost.</p></div>`:''}

    <div class="panel">
      <h3>How billing will work</h3>
      <p class="sub" style="margin:0">Payments run through Stripe. Choosing a paid plan opens Stripe Checkout; a webhook records your plan and unlocks features instantly. Change or cancel anytime from the billing portal. <b>Readers never pay.</b></p>
    </div>

    <!-- DEV PREVIEW: experience tier gating without changing the live launch setting. Remove before production. -->
    <div class="panel" style="border-style:dashed;background:var(--paper-2)">
      <h3 style="font-size:15px">🛠 Preview tier gating (dev only)</h3>
      <p class="sub">Turn this on to see exactly what authors experience once paid tiers go live. It only affects your screen, never real members. Currently <b>${monetizationPreview?'ON':'OFF'}</b>.</p>
      <button class="btn btn-ghost btn-sm" onclick="togglePreview()">${monetizationPreview?'Turn preview OFF':'Turn preview ON'}</button>
    </div>
  </div></div>`;
}

function startCheckout(planId){
  /* PRODUCTION — replace the demo below with a real Stripe Checkout call:
       const res = await fetch('/functions/v1/create-checkout-session', {
         method:'POST',
         headers:{ Authorization:'Bearer '+session.access_token },
         body: JSON.stringify({ plan: planId })
       });
       const { url } = await res.json();
       window.location = url;            // Stripe-hosted Checkout
     A Stripe webhook then writes the new plan to the author_plan column in
     Supabase on payment success, and the gate helpers pick it up automatically. */
  const m=me(); if(!m || m.role!=='author' || m.inhouse) return;
  if(!(MONETIZATION_ENABLED||monetizationPreview)){ toast('Launch mode: every feature is already free.'); return; }
  m.plan=planId; save(DB);
  toast('Now on '+PLANS[planId].name+' — Stripe Checkout runs here in production'); render();
}
function togglePreview(){ monetizationPreview=!monetizationPreview; toast(monetizationPreview?'Tier gating preview ON':'Preview OFF'); render(); }

/* ====================================================================
   PROFILE / SETTINGS
   ==================================================================== */
function viewProfile(){
  const m=me();
  return `<div class="app ${m.role==='author'?'author-mode':''}"><div class="wrap">
    <div class="app-head"><div><h1>My profile</h1><p>How you appear in the club.</p></div></div>
    <div class="panel" style="max-width:560px;margin-top:0">
      <div class="profile-head" style="margin-bottom:18px">
        <div class="big-av" style="background:${m.avatar}">${initials(m.name)}</div>
        <div><b style="font-size:18px">${esc(m.name)}</b><br>
        <span class="chip ${m.role==='author'?'verified':''}">${m.role==='author'?'✍️ Author':'📚 Reader'}</span></div>
      </div>
      <div class="field"><label>Display name</label><input id="pf_name" value="${esc(m.name)}"></div>
      <div class="field"><label>Email</label><input id="pf_email" value="${esc(m.email)}"></div>
      <div class="field"><label>${m.role==='author'?'Author bio (readers see this)':'About you'}</label>
        <textarea id="pf_bio">${esc(m.bio)}</textarea></div>
      <div class="field"><label>Avatar colour</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${AVS.map(c=>`<button onclick="setAvatar('${c}')" style="width:34px;height:34px;border-radius:50%;background:${c};border:${m.avatar===c?'3px solid var(--ink)':'2px solid #fff'};box-shadow:var(--shadow)"></button>`).join('')}</div></div>
      <button class="btn ${m.role==='author'?'btn-spine':'btn-amber'}" onclick="saveProfile()">Save changes</button>
    </div>
  </div></div>`;
}
function setAvatar(c){ me().avatar=c; save(DB); render(); }
function saveProfile(){ const m=me();
  m.name=(document.getElementById('pf_name').value||'').trim()||m.name;
  m.email=(document.getElementById('pf_email').value||'').trim()||m.email;
  m.bio=(document.getElementById('pf_bio').value||'').trim();
  // keep authored books' display name in sync
  DB.books.filter(b=>b.authorUserId===m.id).forEach(b=>b.authorName=m.name);
  save(DB); toast('Profile saved ✓'); render(); }

function notFound(){ return `<div class="app"><div class="wrap"><div class="empty"><div class="ic">🔍</div><h3>Not found</h3><p>That page doesn't exist.</p><button class="btn btn-amber" onclick="go('home')">Back home</button></div></div></div>`; }

/* ====================================================================
   NOTIFICATIONS OPT-IN — email default + push primer (value-framed,
   shown once at a high-intent moment, before any native prompt).
   ==================================================================== */
function maybePrimePush(context){
  const m=me(); if(!m || m.pushPrimed) return;
  m.pushPrimed=true; save(DB);
  document.getElementById('modalMount').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)closeAuth()">
    <div class="modal"><div class="m-head"><button class="x" onclick="closeAuth()">✕</button>
      <h3>Want a heads-up?</h3><p>${esc(context||'We\u2019ll only ping you for things you chose to follow.')}</p></div>
      <div class="m-body">
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">
          <label class="opt-row"><input type="checkbox" id="np_drop" checked> The moment a book you're waiting on drops free</label>
          <label class="opt-row"><input type="checkbox" id="np_reply" checked> When an author replies to you</label>
          <label class="opt-row"><input type="checkbox" id="np_digest"> A weekly digest from authors you follow</label>
        </div>
        <button class="btn btn-amber btn-block" onclick="acceptPush()">Turn on notifications</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeAuth()">Maybe later</button>
        <p style="font-size:11.5px;color:var(--ink-faint);text-align:center;margin-top:10px">You can change this anytime in Notifications. Email updates stay on unless you opt out.</p>
      </div></div></div>`;
}
function acceptPush(){ const m=me(); m.notifPrefs=m.notifPrefs||{}; m.notifPrefs.push=true; save(DB); closeAuth(); toast('Notifications on ✦'); }
function viewNotifPrefs(){
  const m=me(); const p=m.notifPrefs||{email:true,push:false};
  const row=(id,on,label,sub)=>`<label class="pref-row"><div><b>${label}</b><span>${sub}</span></div>
    <input type="checkbox" ${on?'checked':''} onchange="setPref('${id}',this.checked)"></label>`;
  return `<div class="app ${m.role==='author'?'author-mode':''}"><div class="wrap" style="max-width:640px">
    <div class="app-head"><div><h1>Notifications</h1><p>You're in control. Email stays on unless you opt out; push is yours to switch on.</p></div></div>
    ${row('email', p.email!==false, 'Email updates', 'Drop alerts, replies, and your weekly digest')}
    ${row('push', !!p.push, 'Push notifications', 'Real-time pings on this device — opt in when you like')}
    <p style="font-size:12.5px;color:var(--ink-faint);margin-top:16px">Every email carries a one-click unsubscribe. We never sell your data or email your contacts.</p>
  </div></div>`;
}
function setPref(k,v){ const m=me(); m.notifPrefs=m.notifPrefs||{}; m.notifPrefs[k]=v; save(DB);
  if(k==='push'&&v) m.pushPrimed=true; toast('Saved'); }

/* ====================================================================
   FOUNDERS' WALL — numbered founders, the closing window, refer to climb
   ==================================================================== */
function viewFounders(){
  const m=me();
  const founders = DB.users.filter(u=>u.founder && !u.system).sort((a,b)=>a.founderNo-b.founderNo);
  const cap=DB.settings.foundingCap, count=DB.settings.founderCount;
  const pct=Math.min(100, Math.round(count/cap*1000)/10);
  return `<div class="app ${m&&m.role==='author'?'author-mode':''}"><div class="wrap">
    <div class="app-head"><div><h1>The Founders' Wall</h1><p>The first ${cap.toLocaleString()} members are Founding Members — numbered, permanent, and never offered again once the window closes.</p></div></div>
    <div class="founders-meter">
      <b style="font-family:var(--display);font-size:20px">${count.toLocaleString()} of ${cap.toLocaleString()} founding spots claimed</b>
      <div class="bar"><span style="width:${Math.max(2,pct)}%"></span></div>
      <span class="sub" style="margin:0">${foundingSpotsLeft().toLocaleString()} left · refer a friend to climb the wall · 5 invites earns ✦ Charter Member</span>
      ${m?`<div style="margin-top:14px"><button class="btn btn-amber btn-sm" onclick="openInvite()">Invite a friend ✦</button></div>`:''}
    </div>
    ${founders.slice(0,50).map(u=>`<div class="founder-row">
      <div class="fn">№${u.founderNo}</div>
      <div class="m-av" style="width:40px;height:40px;border-radius:50%;background:${u.avatar};display:grid;place-items:center;color:#fff;font-weight:700;flex:none;cursor:pointer" onclick="go('member','${u.id}')">${initials(u.name)}</div>
      <div style="flex:1"><b style="cursor:pointer" onclick="go('member','${u.id}')">${esc(u.name)}</b> ${founderBadge(u)}</div>
    </div>`).join('')}
  </div></div>`;
}

/* ====================================================================
   BOOT
   ==================================================================== */
DB = load();
// capture an invite code from the URL (?invite=CODE) for referral credit
try{ const p=new URLSearchParams(location.search); if(p.get('invite')) authState.inviteCode=p.get('invite'); }catch(e){}
render();
// refresh countdowns every minute
setInterval(()=>{ if(['home','discover','shelf','mybooks'].includes(route.view)) render(); }, 60000);

</script>
